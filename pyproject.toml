[tool.black]
line-length = 79
target-version = ["py310"]

exclude = '''
(
 migrations
)
'''

[tool.isort]
profile = "black"
line_length = 79
skip = ["migrations"]


[tool.ruff]

line-length = 79

exclude = [
    "migrations",
]

target-version = "py310"

[tool.ruff.lint.per-file-ignores]
"config/settings/*.py" = ["F403", "F405"]